  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

:12px;color:#6B6B6B;display:flex;gap:8px;align-items:center\"><span>{{ row.date }}<\u002Fspan><button sc-camel-on-click=\"{{ row.onInvoice }}\" style=\"border:none;background:none;padding:0;font:inherit;font-size:12px;font-weight:700;color:#2D5FB8;cursor:pointer\">GST invoice ↗<\u002Fbutton><\u002Fdiv><\u002Fdiv>\n            <div style=\"text-align:right;flex:none\"><div style=\"font-weight:800;font-size:14px\">{{ row.amount }}<\u002Fdiv><sc-if value=\"{{ row.submitted }}\"><div style=\"font-size:10.5px;font-weight:700;color:#24963F\">SUBMITTED<\u002Fdiv><\u002Fsc-if><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fsc-for>\n  <\u002Fdiv>\n  <div style=\"flex:none;background:#fff;border-top:1px solid #F0EDEA;padding:12px 16px 22px;display:flex;flex-direction:column;gap:10px\">\n    <div style=\"display:flex;justify-content:space-between;font-size:13.5px\"><span style=\"color:#6B6B6B\">{{ selCount }}<\u002Fspan><span style=\"font-weight:800\">{{ selTotal }}<\u002Fspan><\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:8px\">\n      <button sc-camel-on-click=\"{{ exportPdf }}\" style=\"border:1.5px solid #22324A;background:#fff;color:#22324A;font:inherit;font-weight:700;font-size:13.5px;padding:10px;border-radius:12px;cursor:pointer\">Export PDF<\u002Fbutton>\n      <button sc-camel-on-click=\"{{ exportCsv }}\" style=\"border:1.5px solid #22324A;background:#fff;color:#22324A;font:inherit;font-weight:700;font-size:13.5px;padding:10px;border-radius:12px;cursor:pointer\">Export CSV<\u002Fbutton>\n    <\u002Fdiv>\n    <button sc-camel-on-click=\"{{ emailFinance }}\" style=\"border:none;background:#22324A;color:#fff;font:inherit;font-weight:800;font-size:15px;padding:13px;border-radius:12px;cursor:pointer\">Email to finance<\u002Fbutton>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<!-- SETTINGS -->\n<sc-if value=\"{{ isSettings }}\">\n<div data-screen-label=\"Settings\" style=\"position:absolute;inset:0;background:#F7F5F2;z-index:20;display:flex;flex-direction:column;animation:fpSlide .28s cubic-bezier(.2,.8,.2,1)\">\n  <div style=\"flex:none;display:flex;align-items:center;gap:12px;padding:10px 16px;background:#fff;border-bottom:1px solid #F0EDEA\">\n    <button sc-camel-on-click=\"{{ back }}\" style=\"border:none;background:none;padding:4px;cursor:pointer;display:flex\"><svg width=\"22\" height=\"22\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#1C1C1C\" stroke-width=\"2.4\"><path d=\"M15 5l-7 7 7 7\"><\u002Fpath><\u002Fsvg><\u002Fbutton>\n    <div style=\"font-weight:800;font-size:17px\">Family &amp; privacy<\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"flex:1;overflow-y:auto;padding:14px 16px 24px;display:flex;flex-direction:column;gap:10px\">\n    <div style=\"font-size:12px;font-weight:700;color:#6B6B6B;letter-spacing:.06em;padding:4px 4px 0\">FAMILY PROFILES<\u002Fdiv>\n    <div style=\"background:#fff;border-radius:16px;overflow:hidden\">\n      <sc-for list=\"{{ settingsMembers }}\" as=\"m\" hint-placeholder-count=\"4\">\n        <button sc-camel-on-click=\"{{ m.onTap }}\" style=\"width:100%;border:none;border-bottom:1px solid #F2EFEC;background:#fff;font:inherit;color:inherit;cursor:pointer;text-align:left;padding:12px 14px;display:flex;align-items:center;gap:12px\">\n          <span style=\"width:36px;height:36px;border-radius:50%;background:{{ m.color }};color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;flex:none\">{{ m.initial }}<\u002Fspan>\n          <span style=\"flex:1;min-width:0\"><span style=\"display:block;font-weight:700;font-size:14.5px\">{{ m.name }}<\u002Fspan><span style=\"display:block;font-size:12px;color:#6B6B6B\">{{ m.relation }} · {{ m.role }}<\u002Fspan><\u002Fspan>\n          <svg width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#9A958F\" stroke-width=\"2.2\"><path d=\"M9 6l6 6-6 6\"><\u002Fpath><\u002Fsvg>\n        <\u002Fbutton>\n      <\u002Fsc-for>\n      <button sc-camel-on-click=\"{{ openAdd }}\" style=\"width:100%;border:none;background:#fff;font:inherit;cursor:pointer;text-align:left;padding:14px;display:flex;align-items:center;gap:12px;color:#E23744;font-weight:700;font-size:14.5px\"><span style=\"width:36px;height:36px;border-radius:50%;border:1.5px dashed #E23744;display:flex;align-items:center;justify-content:center\"><svg width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\"><path d=\"M12 5v14M5 12h14\"><\u002Fpath><\u002Fsvg><\u002Fspan>Add family member<\u002Fbutton>\n    <\u002Fdiv>\n    <div style=\"font-size:12px;font-weight:700;color:#6B6B6B;letter-spacing:.06em;padding:10px 4px 0\">STEALTH<\u002Fdiv>\n    <div style=\"background:#fff;border-radius:16px;overflow:hidden\">\n      <div style=\"display:flex;align-items:center;gap:12px;padding:14px\">\n        <div style=\"flex:1\"><div style=\"font-weight:700;font-size:14.5px\">Stealth mode<\u002Fdiv><div style=\"font-size:12px;color:#6B6B6B\">Orders skip history, “Order again” and recommendations<\u002Fdiv><\u002Fdiv>\n        <button sc-camel-on-click=\"{{ toggleStealth }}\" style=\"border:none;padding:0;cursor:pointer;flex:none;width:46px;height:28px;border-radius:14px;position:relative;transition:background .2s;background:{{ tStealth.track }}\"><span style=\"position:absolute;top:3px;left:{{ tStealth.knob }}px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:left .2s\"><\u002Fspan><\u002Fbutton>\n      <\u002Fdiv>\n      <div style=\"display:flex;align-items:center;gap:12px;padding:14px;border-top:1px solid #F2EFEC\">\n        <div style=\"flex:1\"><div style=\"font-weight:700;font-size:14.5px\">Auto-delete stealth orders<\u002Fdiv><div style=\"font-size:12px;color:#6B6B6B\">Remove them 24 hours after delivery<\u002Fdiv><\u002Fdiv>\n        <button sc-camel-on-click=\"{{ toggleAuto }}\" style=\"border:none;padding:0;cursor:pointer;flex:none;width:46px;height:28px;border-radius:14px;position:relative;transition:background .2s;background:{{ tAuto.track }}\"><span style=\"position:absolute;top:3px;left:{{ tAuto.knob }}px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:left .2s\"><\u002Fspan><\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"font-size:12px;font-weight:700;color:#6B6B6B;letter-spacing:.06em;padding:10px 4px 0\">WHAT EACH PROFILE CAN SEE<\u002Fdiv>\n    <div style=\"background:#F4F6FA;border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:9px;color:#33415C;font-size:13px;line-height:1.45\">\n      <div style=\"display:flex;gap:8px\"><b style=\"flex:none\">·<\u002Fb><span><b>Order history is private.<\u002Fb> By default, members can't see each other's orders.<\u002Fspan><\u002Fdiv>\n      <div style=\"display:flex;gap:8px\"><b style=\"flex:none\">·<\u002Fb><span>Diet, allergies and spice level are shared, so family picks stay safe for everyone.<\u002Fspan><\u002Fdiv>\n      <div style=\"display:flex;gap:8px\"><b style=\"flex:none\">·<\u002Fb><span>Stealth orders are never visible to anyone else, including the family admin.<\u002Fspan><\u002Fdiv>\n      <div style=\"display:flex;gap:8px\"><b style=\"flex:none\">·<\u002Fb><span>Business orders and invoices stay inside your Business profile.<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"font-size:12px;font-weight:700;color:#6B6B6B;letter-spacing:.06em;padding:10px 4px 0\">BUSINESS PROFILE<\u002Fdiv>\n    <div style=\"background:#fff;border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:8px;font-size:13.5px\">\n      <div style=\"display:flex;justify-content:space-between\"><span style=\"color:#6B6B6B\">Company<\u002Fspan><span style=\"font-weight:700\">{{ company }}<\u002Fspan><\u002Fdiv>\n      <div style=\"display:flex;justify-content:space-between\"><span style=\"color:#6B6B6B\">GSTIN<\u002Fspan><span style=\"font-weigh ya']}\n  ];\n  static AL = {nuts:'Nuts',dairy:'Dairy',gluten:'Gluten',shellfish:'Shellfish',egg:'Egg',soy:'Soy'};\n  static DIET = {veg:'Pure veg',nonveg:'Non-veg',vegan:'Vegan',jain:'Jain',eggetarian:'Eggetarian'};\n  static KEY = 'fp-proto-v1';\n\n  blankDraft() { return {name:'',relation:'Parent',color:'#2D7FF9',diet:'veg',allergies:[],spice:2,cuisines:[],role:'influence'}; }\n  fresh() {\n    const C = Component;\n    return {tab:'home',stack:[],sheet:null,activeId:'me',orderingFor:'me',mode:'personal',stealth:false,autoDelete:true,\n      members:JSON.parse(JSON.stringify(C.M)),orders:JSON.parse(JSON.stringify(C.O)),going:['me','priya','aarav','mom'],\n      restId:'r1',cart:{},trip:'Delhi trip, Oct 2026',tripDraft:'',reimbSel:[],submitted:[],exportResult:null,\n      booking:{rid:'r7',day:'Sat 11 Oct',time:'8:00 PM',guests:4,requests:[]},bookingDone:null,memberId:'priya',\n      draft:this.blankDraft(),draftErr:'',ordersFilter:'all',placed:null,showFlagged:false};\n  }\n  load() { try { return JSON.parse(sessionStorage.getItem(Component.KEY)) || {}; } catch (e) { return {}; } }\n  state = Object.assign(this.fresh(), this.load(), {scale:1, wide:true, toast:null, guide:false});\n\n  componentDidMount() {\n    this.onResize = () => {\n      const wide = window.innerWidth >= 980;\n      const w = window.innerWidth - (wide ? 400 : 0) - 32, h = window.innerHeight - 32;\n      this.setState({wide, scale: Math.max(0.4, Math.min(1, w / 414, h / 868))});\n    };\n    this.onResize();\n    window.addEventListener('resize', this.onResize);\n    let seen = false; try { seen = sessionStorage.getItem('fp-guide-seen'); sessionStorage.setItem('fp-guide-seen', '1'); } catch (e) {}\n    if (!seen) setTimeout(() => this.setState({guide:true}), 600);\n  }\n  componentWillUnmount() { window.removeEventListener('resize', this.onResize); }\n  componentDidUpdate() {\n    const {scale, wide, toast, guide, ...rest} = this.state;\n    try { sessionStorage.setItem(Component.KEY, JSON.stringify(rest)); } catch (e) {}\n  }\n\n  fmt(n) { return '₹' + Math.round(n).toLocaleString('en-IN'); }\n  rest(id) { return Component.R.find(r => r.id === id) || Component.R[0]; }\n  img(h) { return `repeating-linear-gradient(135deg, oklch(0.93 0.04 ${h}) 0 9px, oklch(0.895 0.055 ${h}) 9px 18px)`; }\n  toast(msg) { clearTimeout(this.tt); this.setState({toast:msg}); this.tt = setTimeout(() => this.setState({toast:null}), 2300); }\n  push(name, extra) { this.setState(s => Object.assign({stack:[...s.stack, name], sheet:null}, extra || {})); }\n  openRest(id) { this.setState(s => ({restId:id, cart: s.restId === id ? s.cart : {}, stack:[...s.stack, 'restaurant'], sheet:null})); }\n  setQty(i, d) { this.setState(s => { const c = Object.assign({}, s.cart); c[i] = Math.max(0, (c[i] || 0) + d); return {cart:c}; }); }\n\n  pos(m) { return m.id === this.state.activeId ? 'your ' : m.name + \"'s \"; }\n  tags(m) {\n    const C = Component, t = [];\n    if (m.kid) t.push('Kid-friendly');\n    if (m.diet !== 'nonveg') t.push(C.DIET[m.diet]);\n    if (m.noOG || m.diet === 'jain') t.push('No onion/garlic');\n    t.push(['','Mild','Medium spice','Spicy'][m.spice]);\n    if ((m.goals || []).includes('highprotein')) t.push('High protein');\n    if (m.diet === 'nonveg') t.push('Non-veg');\n    m.allergies.forEach(a => t.push(a === 'nuts' ? 'Nut allergy' : 'No ' + C.AL[a].toLowerCase()));\n    if (m.id === 'me') return ['Spicy', 'High protein', 'Non-veg'];\n    return t;\n  }\n  score(r, m) {\n    let s = 64; const reasons = []; const p = this.pos(m);\n    const veggie = ['veg','vegan','jain'].includes(m.diet);\n    if (veggie) { if (r.type === 'veg') { s += 14; reasons.push([3, p + 'veg diet']); } else if (r.type === 'nonveg') s -= 40; }\n    if (m.diet === 'eggetarian') { if (r.type === 'nonveg') s -= 25; else s += 4; }\n    if (m.diet === 'nonveg' && r.type !== 'veg') s += 4;\n    if (m.diet === 'vegan') { if (r.tags.includes('vegan')) { s += 12; reasons.push([4, p + 'vegan diet']); } else s -= 12; }\n    if (m.noOG || m.diet === 'jain') { if (r.tags.includes('jain')) { s += 14; reasons.push([4, p + 'no onion/garlic rule']); } else s -= 10; }\n    const d = Math.abs(r.spice - m.spice);\n    s += d === 0 ? 10 : d === 1 ? 0 : -18;\n    if (d === 0) reasons.push([m.spice === 1 ? 2.5 : 1.5, p + (m.spice === 1 ? 'mild preference' : m.spice === 3 ? 'love of spice' : 'medium spice level')]);\n    if (m.kid && r.tags.includes('kid')) { s += 8; reasons.push([2, p + 'kid-friendly needs']); }\n    if ((m.goals || []).includes('highprotein') && r.tags.includes('highprotein')) { s += 8; reasons.push([2, p + 'high-protein goal']); }\n    const c = r.cuisines.find(x => m.cuisines.includes(x));\n    if (c) { s += 10; reasons.push([1, p + 'taste for ' + c]); }\n    reasons.sort((a, b) => b[0] - a[0]);\n    return {s: Math.max(35, Math.min(98, s)), reasons};\n  }\n  conflicts(r, list) {\n    const C = Component, out = [];\n    list.forEach(m => {\n      const nm = m.id === this.state.activeId ? 'you' : m.name;\n      m.allergies.filter(a => r.allergens.includes(a)).forEach(a => out.push(`Contains ${C.AL[a].toLowerCase()} · ${nm}`));\n      if (['veg','vegan','jain'].includes(m.diet) && r.type === 'nonveg') out.push(`No veg menu · ${nm}`);\n    });\n    return out;\n  }\n  guideGo(patch, msg) {\n    this.setState(Object.assign({stack:[], sheet:null, guide:false}, patch));\n    if (msg) this.toast(msg);\n  }\n\n  renderVals() {\n    const C = Component, s = this.state, fmt = n => this.fmt(n);\n    const members = s.members;\n    const me = members.find(m => m.id === 'me');\n    const active = members.find(m => m.id === s.activeId) || me;\n    const isBiz = s.mode === 'business';\n    const top = s.stack[s.stack.length - 1] || null;\n    const tg = (on, c) => ({track: on ? (c || '#E23744') : '#D6D3CF', knob: on ? 21 : 3});\n    const av = m => ({name: m.name, initial: m.name.charAt(0).toUpperCase(), color: m.color});\n    const chip = sel => ({bg: sel ? '#FFF1F2' : ' allergies', a)})),\n      draftSpice: [[1,'Mild'],[2,'Medium'],[3,'Spicy']].map(([v, l]) => Object.assign(chip(dr.spice === v), {label:l, onTap: () => setD({spice:v})})),\n      draftCuisines: ['North Indian','South Indian','Gujarati','Italian','Asian','Healthy','Grills','Seafood'].map(c => Object.assign(chip(dr.cuisines.includes(c)), {label:c, onTap: togD('cuisines', c)})),\n      draftRoles: [['order','Can place orders','Checks out with the family wallet'],['influence','Influences recommendations only','Shapes family picks; carts come to you for approval']].map(([k, l, sb]) => ({label:l, sub:sb, bg: dr.role === k ? '#FFF6F7' : '#fff', bd: dr.role === k ? '#E23744' : '#E6E3DF', onTap: () => setD({role:k})})),\n      saveDraft: () => this.saveDraft(),\n\n      // sheets\n      sheetOpen: !!s.sheet, shSwitcher: s.sheet === 'switcher', shTrip: s.sheet === 'trip', shExport: s.sheet === 'export',\n      closeSheet: () => this.setState({sheet:null}),\n      switchList: members.map(m => Object.assign(av(m), {relation: m.relation, tags: this.tags(m).slice(0, 3).join(' · ') + (m.canOrder ? '' : ' · suggestions only'), isActive: m.id === s.activeId, bg: m.id === s.activeId ? '#FFF6F7' : 'transparent',\n        onTap: () => { this.setState({activeId: m.id, orderingFor: m.id, sheet:null}); this.toast(`Switched to ${m.name}`); }})),\n      tripDraft: s.tripDraft, setTripDraft: e => this.setState({tripDraft: e.target.value}),\n      tripSuggestions: ['Delhi trip, Oct 2026','Mumbai offsite, Nov 2026','Client dinner, Gurugram'].map(l => ({label:l, onTap: () => this.setState({tripDraft:l})})),\n      saveTrip: () => { const t = (this.state.tripDraft || '').trim(); if (!t) return this.toast('Add a label first'); this.setState({trip:t, sheet:null}); this.toast('New business orders tagged “' + t + '”'); },\n\n      hasToast: !!s.toast, toast: s.toast,\n      guideSteps: [\n        {n:'1', title:\"Switch who's eating\", body:'Tap the avatar chip on Home. Greeting, picks and diet tags change instantly.', go: () => this.guideGo({tab:'home', mode:'personal', sheet:'switcher'})},\n        {n:'2', title:'Order for the whole family', body:'Blended picks with a “Why this?” on each. Allergy and diet clashes are hidden.', go: () => this.guideGo({tab:'home', mode:'personal', activeId:'me', orderingFor:'family'}, 'Ordering for the whole family')},\n        {n:'3', title:'Plan a dinner out', body:\"Pick who's coming. Each venue gets a group match score and per-person chips.\", go: () => this.guideGo({tab:'out'})},\n        {n:'4', title:'Order in Stealth mode', body:'Place any order, then open Orders: it skips “Order again” and your recommendations.', go: () => this.guideGo({tab:'home', mode:'personal', stealth:true}, 'Stealth on. Open any restaurant and order')},\n        {n:'5', title:'Switch to Business', body:'Corporate card, GST invoice and trip tags, plus a one-tap reimbursement report.', go: () => this.guideGo({tab:'home', mode:'business', activeId:'me'}, 'Business profile on')}\n      ],\n      resetDemo: () => { this.setState(Object.assign(this.fresh(), {guide:false})); this.toast('Demo reset'); }\n    };\n  }\n\n  reqOptions(goingM) {\n    const C = Component, out = [];\n    goingM.forEach(m => {\n      if (m.kid) out.push(`High chair for ${m.name}`);\n      if (m.noOG || m.diet === 'jain') out.push(`No onion/garlic for ${m.name}`);\n      m.allergies.forEach(a => out.push(`${C.AL[a]} allergy: ${m.name}`));\n    });\n    return out.concat(['Quiet corner table', 'Celebrating an occasion']);\n  }\n  reserve(rid) {\n    const goingM = this.state.members.filter(m => this.state.going.includes(m.id));\n    const auto = this.reqOptions(goingM).slice(0, -2);\n    this.setState(s => ({booking: {rid, day:'Sat 11 Oct', time:'8:00 PM', guests: Math.max(1, goingM.length), requests: auto}, stack:[...s.stack, 'booking'], sheet:null}));\n  }\n  setBk(patch) { this.setState(s => ({booking: Object.assign({}, s.booking, patch)})); }\n  openAddFn() { this.setState(s => ({draft: this.blankDraft(), draftErr:'', stack:[...s.stack, 'addMember'], sheet:null})); }\n  saveDraft() {\n    const d = this.state.draft, name = d.name.trim();\n    if (!name) return this.setState({draftErr:'Add a name to continue'});\n    const m = {id:'m' + Date.now(), name, relation: d.relation === 'Kid' ? 'Kid' : d.relation, color: d.color, diet: d.diet, noOG: d.diet === 'jain', allergies: d.allergies, spice: d.spice,\n      cuisines: d.cuisines, goals: [], kid: d.relation === 'Kid', canOrder: d.role === 'order', influence: true, seeMine: false};\n    this.setState(s => ({members: [...s.members, m], stack: s.stack.slice(0, -1), draft: this.blankDraft()}));\n    this.toast(`${name} added to your family`);\n  }\n  placeOrder(lines, total, rest, forFamily, target, needsApproval) {\n    const s = this.state, isBiz = s.mode === 'business';\n    const active = s.members.find(m => m.id === s.activeId);\n    const go = (placed, extra) => this.setState(st => Object.assign({placed, cart:{}, stack: [...st.stack.slice(0, -2), 'placed']}, extra || {}));\n    if (needsApproval) {\n      return go({title:'Request sent to Arjun', sub:`${rest.name} · ${this.fmt(total)}`, color:'#E8A13A', notes:[\n        {text:`${active.name}'s profile influences picks but can't pay. Arjun can approve from his phone.`, bg:'#FFF7E8', fg:'#7A4A00'}]});\n    }\n    const o = {id:'o' + Date.now(), by: active.id, rid: rest.id, date:'9 Oct', amount: total, mode: s.mode, forId: isBiz ? active.id : (forFamily ? 'family' : target.id),\n      items: lines.map(l => (l.qty > 1 ? l.qty + '× ' : '') + l.name).join(', '), stealth: s.stealth, autoDelete: s.autoDelete, createdAt: Date.now(), trip: isBiz ? s.trip : undefined};\n    const notes = [];\n    if (s.stealth) {\n      notes.push({text:'Stealth: kept out of “Order again” and your recommendations.', bg:'#1F1F23', fg:'#fff'});\n      notes.push({text: s.autoDelete ? 'Auto-deletes from your history in 24 hours.' : 'Kept privately until you delete it.', bg:'#F1F1F3', fg:'#1F1F23'});\n    }\n    if (isBiz) {\n      notes.push({text:`Tagged to “${s.trip}”. Edit anytime from Home.`, bg:'#EEF2F8', fg:'#22324A'});\n      notes.push({text:'GST invoice for Northwind Analytics will be emailed and added to Reimbursements.', bg:'#EEF2F8', fg:'#22324A'});\n    }\n    if (!s.stealth && !isBiz) notes.push({text: forFamily ? 'Saved to family favourites. Future family picks will learn from it.' : `Your next recommendations will learn from this order.`, bg:'#F5F3F0', fg:'#3D3A36'});\n    go({title: s.stealth ? 'Placed quietly' : 'Order placed', sub:`${rest.name} · arriving in about ${rest.time} min`, color: s.stealth ? '#1F1F23' : '#24963F', notes}, {orders: [o, ...s.orders]});\n  }\n}\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
